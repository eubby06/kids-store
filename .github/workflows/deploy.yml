name: Deploy to AWS ECR

on:
  push:
    branches: [main] # Triggers whenever you push code to your main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: laravel-inertia-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          key_id: laravel-deploy-key
          script: |
            # 1. Log into your full ECR registry cleanly
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 425389088581.dkr.ecr.us-east-1.amazonaws.com

            # 2. Force pull your freshly built image layers down to the server
            docker pull 425389088581.dkr.ecr.us-east-1.amazonaws.com/laravel-inertia-app:latest

            # 3. Stop and delete the old container version safely if it exists
            docker stop my-app-container || true
            docker rm my-app-container || true

            # 4. Fire up the fresh container while explicitly injecting your key strings
            docker run -d --name my-app-container \
              -p 80:80 \
              -e APP_ENV=production \
              -e APP_DEBUG=true \
              -e APP_KEY="${{ secrets.LARAVEL_APP_KEY }}" \
              -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=/var/www/html/database/database.sqlite \
              425389088581.dkr.ecr.us-east-1.amazonaws.com/laravel-inertia-app:latest
              
            # 5. Wait 3 seconds for the container to settle, then initialize your sqlite tables
            sleep 3
            docker exec my-app-container touch database/database.sqlite
            docker exec my-app-container php artisan migrate --force
