name: Deploy to AWS ECR

on:
  push:
    branches: [main, master] # Triggers on BOTH main and master to ensure it fires!

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: laravel-inertia-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          key_id: laravel-deploy-key
          script: |
            # 1. Log into your ECR registry
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 425389088581.dkr.ecr.us-east-1.amazonaws.com

            # 2. Force pull the fresh image layers
            docker pull 425389088581.dkr.ecr.us-east-1.amazonaws.com/laravel-inertia-app:latest

            # 3. Clean up the old container version safely if it exists
            docker stop my-app-container || true
            docker rm my-app-container || true

            # 4. Fire up the fresh container completely on ONE LINE pointed to your AWS RDS MySQL
            docker run -d --name my-app-container -p 80:80 -e APP_ENV=production -e APP_DEBUG=true -e APP_KEY="${{ secrets.LARAVEL_APP_KEY }}" -e DB_CONNECTION=mysql -e DB_HOST="${{ secrets.DB_HOST }}" -e DB_PORT="${{ secrets.DB_PORT }}" -e DB_DATABASE="${{ secrets.DB_DATABASE }}" -e DB_USERNAME="${{ secrets.DB_USERNAME }}" -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" 425389088581.dkr.ecr.us-east-1.amazonaws.com/laravel-inertia-app:latest
              
            # 5. Wait 5 seconds for the container to settle
            sleep 5

            # 6. Apply database tables directly to your RDS cluster cloud space
            docker exec my-app-container php artisan migrate --force

            # 7. ✅ FIXED RUNTIME COMMAND: Executes raw database creations using the proper Tinker hook
            docker exec my-app-container php artisan tinker --execute="\App\Models\User::firstOrCreate(['email' => 'admin@example.com'], ['name' => 'Admin User', 'password' => \Illuminate\Support\Facades\Hash::make('password')]);"
