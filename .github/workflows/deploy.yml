name: Deploy to AWS ECR

on:
  push:
    branches: [main] # Triggers whenever you push code to your main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: laravel-inertia-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.223.83.19
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Log into your ECR registry inside the N. Virginia region from the server
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # 2. Force pull your freshly built image layers down to the server
            docker pull ${{ steps.login-ecr.outputs.registry }}/laravel-inertia-app:latest

            # 3. Stop and delete the old container version safely
            docker stop my-app-container || true
            docker rm my-app-container || true

            # 4. Fire up the fresh container mapping the web traffic on port 80
            docker run -d --name my-app-container -p 80:80 ${{ steps.login-ecr.outputs.registry }}/laravel-inertia-app:latest
