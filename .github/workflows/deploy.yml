name: Deploy to AWS ECR

on:
  push:
    branches: [main] # Triggers whenever you push code to your main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: laravel-inertia-app
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          key_id: laravel-deploy-key
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ://amazonaws.com
            docker pull ://amazonaws.com/laravel-inertia-app:latest
            docker stop my-app-container || true
            docker rm my-app-container || true

            # Fire up the container while explicitly injecting your GitHub secret as an environment variable
            docker run -d --name my-app-container \
              -p 80:80 \
              -e APP_ENV=production \
              -e APP_DEBUG=true \
              -e APP_KEY="${{ secrets.LARAVEL_APP_KEY }}" \
              ://amazonaws.com/laravel-inertia-app:latest
